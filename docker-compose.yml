# `docker compose up`                      -> reproduce the result offline: verify data/, rerun the registered analysis,
#                                             compare with the committed result (needs no key, sends nothing; 3-20 min)
# `docker compose run --rm plan`           -> dry-run plan on mainnet (never sends; needs RPC_URL in .env)
# `docker compose run --rm analyze`        -> regenerate docs/REPORT.md from committed data/ (deterministic)
# `docker compose run --rm verify`         -> re-check data/ offline, then re-fetch every block (read-only)
# `docker compose run --rm sender dry-run --duration-secs 86400`   (Phase 4, never sends)
# `docker compose run --rm keys init-payers --count 32`             (writes ./secrets)
# `docker compose run --rm -e CONFIRM_LIVE=yes sender live --purpose calibrate --max-spend-lamports N`
services:
  plan:
    build: { context: ., target: sender }
    image: slwlab-sender:local
    profiles: ["manual"]
    command: ["plan"]
    env_file: [{ path: .env, required: false }]
    environment: [RPC_URL, RPC_WS_URL, RPC_MAX_RPS, RPC_SEND_TX_RPS, RPC_MONTHLY_CREDITS]
    volumes:
      - ./data:/lab/data
      - ./secrets:/lab/secrets:ro

  sender:
    image: slwlab-sender:local
    build: { context: ., target: sender }
    profiles: ["manual"]
    env_file: [{ path: .env, required: false }]
    environment: [RPC_URL, RPC_WS_URL, RPC_MAX_RPS, RPC_SEND_TX_RPS, RPC_MONTHLY_CREDITS, CONFIRM_LIVE]
    volumes:
      - ./data:/lab/data
      - ./secrets:/lab/secrets:ro

  # The only service that may write ./secrets (payer and sink keypairs).
  keys:
    image: slwlab-sender:local
    build: { context: ., target: sender }
    profiles: ["manual"]
    env_file: [{ path: .env, required: false }]
    environment: [RPC_URL]
    volumes:
      - ./secrets:/lab/secrets

  analyze:
    build: { context: ., target: analysis }
    image: slwlab-analysis:local
    profiles: ["manual"]
    working_dir: /lab/analysis
    command: ["python", "-m", "slwlab.report"]         # docs/REPORT.md (deterministic, --check to compare)
    volumes:
      - ./data:/lab/data:ro
      - ./docs:/lab/docs

  verify:
    image: slwlab-analysis:local
    build: { context: ., target: analysis }
    profiles: ["manual"]
    env_file: [{ path: .env, required: false }]
    environment: [RPC_URL]
    command: ["python", "scripts/verify_manifest.py", "--online"]
    volumes:
      - ./data:/lab/data

  # THE one command (`docker compose up`): verify the committed data offline, rerun the registered analysis,
  # compare it with the committed result (analysis/results/confirmatory_2026-11-03/). Needs no key and no
  # network, reads the repository read-only, writes only /tmp inside the container. Exit code 0 only if it
  # reproduces. `docker compose up --exit-code-from reproduce` passes that code on (CI does).
  # 3 to 20 minutes with the verification, depending on the disk; without it (about a minute):
  # `docker compose run --rm reproduce python scripts/reproduce.py --skip-verify`
  reproduce:
    build: { context: ., target: analysis }
    image: slwlab-analysis:local
    working_dir: /lab
    command: ["python", "scripts/reproduce.py", "--out", "/tmp/reproduced"]
    volumes:
      - .:/lab:ro
