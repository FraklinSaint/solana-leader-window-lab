[package]
name = "slwlab-sender"
description = "Planner, clock model, tx builder, QUIC sender and spend ledger (dry-run by default)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sender"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bs58 = "0.5.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
quinn = "0.11.12"
rand = "0.10.3"
rand_chacha = "0.10.0"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
slwlab-common = { path = "../common" }
slwlab-winsys = { path = "../winsys" }
solana-hash = "4.7.0"
solana-keypair = "4.0.0"
solana-pubkey = { version = "4.4.0", features = ["serde"] }
solana-signature = "3.6.0"
solana-signer = "4.0.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
webpki-roots = "1.0.10"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
solana-instruction = "4.0.0"
solana-message = { version = "6.0.0", features = ["wincode"] }
solana-transaction = "6.0.0"
tempfile = "3.27.0"
