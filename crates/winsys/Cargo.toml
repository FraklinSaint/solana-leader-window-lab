[package]
name = "slwlab-winsys"
description = "The only unsafe code in the workspace: five Windows API calls behind safe functions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not `workspace = true`: the workspace forbids unsafe code, and FFI needs it. Everything else
# stays strict, and every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }
