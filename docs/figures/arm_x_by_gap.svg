  <text class="ink2 sm" x="20" y="526">Post-hoc and exploratory: written after the confirmatory results were seen, not part of the preregistered analysis, no verdict.</text>
  <text class="ink2 sm" x="20" y="541">In Arm X the fee is the reverse of the send order, so the tau of the send-order rule is the same number with the opposite sign. Cells are small</text>
