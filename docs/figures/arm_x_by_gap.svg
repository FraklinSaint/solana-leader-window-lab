<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 590" width="850" height="590" role="img" aria-labelledby="fig-title fig-desc">
  <title id="fig-title">Arm X: does the block follow the fee or the send order, by gap between sends</title>
  <desc id="fig-desc">Small multiples, one panel for all groups together and one per client group. Each panel plots the mean Kendall tau between the block order and the fee order of the six transactions of Arm X, against the gap between sends (0, 10, 25, 60, 120 ms; no usable window at 120 ms). Plus one means the block follows the fee, minus one means it follows the send order. All groups pooled: 0 ms +0.31 over 66 windows; 10 ms −0.37 over 67 windows; 25 ms −0.81 over 47 windows; 60 ms −0.63 over 14 windows. The same numbers are in docs/EXPLORATORY_GAP_TABLE.md.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
    .bg { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; }
    .grid { stroke: #e6e5e1; stroke-width: 1; } .zero { stroke: #b9b8b3; stroke-width: 1; }
    .s { stroke: #2a78d6; fill: none; } .f { fill: #2a78d6; } .hole { fill: #fcfcfb; stroke: #2a78d6; stroke-width: 2; }
    .ring { fill: #fcfcfb; }
    .b { font-weight: 600; } .t { font-size: 17px; font-weight: 600; } .sm { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; } .ink { fill: #f0efec; } .ink2 { fill: #c3c2b7; }
      .grid { stroke: #2d2d2b; } .zero { stroke: #5a5a56; }
      .s { stroke: #3987e5; } .f { fill: #3987e5; } .hole { fill: #1a1a19; stroke: #3987e5; }
      .ring { fill: #1a1a19; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="850" height="590"/>
  <text class="ink t" x="20" y="30">Arm X: does the block follow the fee or the send order?</text>
  <text class="ink2" x="20" y="52">Mean tau of the fee rule per window, by gap between the sends. +1: block follows the fee. −1: block follows the send order.</text>
  <circle class="f" cx="28" cy="74" r="4.5"/>
  <text class="ink2 sm" x="38" y="78">at least 5 usable windows</text>
  <circle class="hole" cx="190" cy="74" r="4.5"/>
  <text class="ink2 sm" x="200" y="78">fewer than 5</text>
  <line class="s" stroke-width="1.5" x1="296" y1="68" x2="296" y2="80"/>
  <text class="ink2 sm" x="306" y="78">bootstrap 95% interval over windows</text>
  <text class="ink2 sm" x="20" y="96">x axis: gap between sends in ms (categories, not to scale). n: usable windows in that cell.</text>
