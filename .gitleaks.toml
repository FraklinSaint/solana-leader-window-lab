title = "solana-leader-window-lab"
[extend]
useDefault = true

[[rules]]
id = "solana-keypair-json"
description = "solana-keygen keypair (64-integer JSON array)"
regex = '''\[\s*(?:\d{1,3}\s*,\s*){63}\d{1,3}\s*\]'''

[allowlist]
description = "public on-chain data (signatures, pubkeys) is not secret"
paths = ['''^data/raw/''', '''^data/snapshots/''', '''^docs/BOUNTY\.md$''']
